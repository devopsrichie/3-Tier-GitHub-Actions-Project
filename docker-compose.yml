# Local 3-tier stack:  client (nginx + React)  ->  api (Node/Express)  ->  mysql
# Usage: docker compose up --build   then open http://localhost:3000

services:
  mysql:
    image: mysql:8.0
    container_name: auction-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: auction_db
      MYSQL_USER: auction
      MYSQL_PASSWORD: auction
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: auction-api
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: auction
      DB_PASSWORD: auction
      DB_NAME: auction_db
      JWT_SECRET: local-dev-secret
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: auction-client
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mysql-data:
