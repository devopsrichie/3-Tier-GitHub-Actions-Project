# EXAMPLE ONLY. Change these values before deploying, or create the secret from the CLI:
#   kubectl create secret generic auction-secrets -n auction \
#     --from-literal=MYSQL_ROOT_PASSWORD=... --from-literal=DB_PASSWORD=... --from-literal=JWT_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: auction-secrets
  namespace: auction
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-root-password
  DB_PASSWORD: change-db-password
  JWT_SECRET: change-jwt-secret
