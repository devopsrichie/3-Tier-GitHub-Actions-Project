# StorageClass for the MySQL volume.
# Default below uses Rancher local-path (built into k3s / kind; install on others with:
#   kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml)
#
# Swap the provisioner for your cluster if needed:
#   AWS EKS  -> ebs.csi.aws.com        (parameters: type: gp3)
#   GKE      -> pd.csi.storage.gke.io  (parameters: type: pd-balanced)
#   AKS      -> disk.csi.azure.com     (parameters: skuName: StandardSSD_LRS)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: auction-storage
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
